<!DOCTYPE html>
<html>
<head>
    <title>Search Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>🔍 Search Hotels</h2>

<div class="row mb-3">
    <div class="col-md-3">
        <input id="name" class="form-control" placeholder="Hotel Name">
    </div>
    <div class="col-md-3">
        <input id="city" class="form-control" placeholder="City">
    </div>
    <div class="col-md-3">
        <input id="state" class="form-control" placeholder="State">
    </div>
    <div class="col-md-3">
        <button onclick="search()" class="btn btn-primary w-100">Search</button>
    </div>
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Reg ID</th>
            <th>Ref No</th>
            <th>Hotel Name</th>
            <th>City</th>
            <th>State</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="results"></tbody>
</table>

<script>
function search() {

    let name = document.getElementById("name").value;
    let city = document.getElementById("city").value;
    let state = document.getElementById("state").value;

    fetch(`/get-hotels?name=${name}&city=${city}&state=${state}`)
    .then(res => res.json())
    .then(data => {

        let html = "";

        data.forEach(row => {

            html += `
            <tr>
                <td>${row.registration_id}</td>
                <td>${row.reference_number}</td>
                <td>${row.hotel_name}</td>
                <td>${row.city}</td>
                <td>${row.state}</td>
                <td>
                    <button onclick="viewHotel(${row.id})" class="btn btn-info btn-sm">View</button>
                    <button onclick="editHotel(${row.id})" class="btn btn-warning btn-sm">Edit</button>
                </td>
            </tr>`;
        });

        document.getElementById("results").innerHTML = html;
    });
}

function viewHotel(id) {
    window.location.href = "/view/" + id;
}

function editHotel(id) {
    window.location.href = "/edit/" + id;
}
</script>

</body>
</html>
